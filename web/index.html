<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SeeSound</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="stage">
        <canvas id="visualizer" aria-label="Music video visualizer preview"></canvas>
        <img id="overlayPreview" class="overlay-preview" alt="" hidden>
        <div class="hud">
          <div>
            <span id="trackName">No song loaded</span>
            <strong id="timeReadout">00:00 / 00:00</strong>
          </div>
          <div class="meter" aria-hidden="true">
            <span id="levelMeter"></span>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Visualizer controls">
        <div class="brand">
          <h1>SeeSound</h1>
          <p>Seeded live music-video visualizer</p>
        </div>

        <label id="songDrop" class="file-drop" for="songInput">
          <input id="songInput" type="file" accept="audio/*">
          <span>Load Song</span>
          <small>Drop audio here or browse</small>
        </label>

        <div class="transport">
          <button id="playButton" type="button" disabled>Play</button>
          <button id="stopButton" type="button" disabled>Stop</button>
          <button id="exportButton" type="button" disabled>Export Video</button>
          <a id="downloadLink" class="download-link" hidden download="seesound-video.webm">Download Video</a>
        </div>

        <label class="field">
          <span>Seed</span>
          <div class="seed-row">
            <input id="seedInput" type="text" value="aurora-808">
            <button id="randomSeed" type="button" aria-label="Random seed">Shuffle</button>
          </div>
        </label>

        <button id="remixButton" class="remix-button" type="button">Remix Look</button>

        <section class="overlay-controls" aria-label="Image overlay controls">
          <label class="file-drop compact" for="overlayInput">
            <input id="overlayInput" type="file" accept="image/*">
            <span>Overlay Image</span>
            <small>PNG, JPG, SVG, WebP</small>
          </label>

          <div class="control-grid">
            <label class="field">
              <span>Position</span>
              <select id="overlayPosition">
                <option value="top-left">Top Left</option>
                <option value="top-right" selected>Top Right</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="bottom-right">Bottom Right</option>
                <option value="center">Center</option>
              </select>
            </label>

            <button id="clearOverlay" type="button" disabled>Clear Overlay</button>
          </div>

          <label class="knob">
            <span>Logo Size</span>
            <input id="overlaySize" type="range" min="6" max="50" value="18">
            <output>18</output>
          </label>

          <label class="knob">
            <span>Opacity</span>
            <input id="overlayOpacity" type="range" min="0" max="100" value="90">
            <output>90</output>
          </label>

          <label class="knob">
            <span>Logo Life</span>
            <input id="overlayLife" type="range" min="0" max="100" value="24">
            <output>24</output>
          </label>
        </section>

        <div class="control-grid">
          <label class="field">
            <span>Scene</span>
            <select id="sceneSelect">
              <option value="nebula">Nebula Flow</option>
              <option value="tunnel">Tunnel</option>
              <option value="radar">Liquid Ribbons</option>
              <option value="crystal">Glass Bloom</option>
              <option value="waveform">Waveform Field</option>
              <option value="orbit">Orbit Grid</option>
            </select>
          </label>

          <label class="field">
            <span>Palette</span>
            <select id="paletteSelect">
              <option value="prism">Prism</option>
              <option value="ember">Ember</option>
              <option value="glacier">Glacier</option>
              <option value="acid">Acid</option>
              <option value="velvet">Velvet</option>
              <option value="chrome">Chrome</option>
              <option value="mono">Mono</option>
              <option value="solar">Solar</option>
              <option value="lagoon">Lagoon</option>
              <option value="candy">Candy</option>
              <option value="noir">Noir</option>
            </select>
          </label>
        </div>

        <div class="knobs">
          <label class="knob">
            <span>Energy</span>
            <input id="energy" type="range" min="0" max="100" value="68">
            <output>68</output>
          </label>
          <label class="knob">
            <span>Bloom</span>
            <input id="bloom" type="range" min="0" max="100" value="58">
            <output>58</output>
          </label>
          <label class="knob">
            <span>Center</span>
            <input id="center" type="range" min="0" max="100" value="46">
            <output>46</output>
          </label>
          <label class="knob">
            <span>Color</span>
            <input id="color" type="range" min="0" max="140" value="100">
            <output>100</output>
          </label>
          <label class="knob">
            <span>Saturate</span>
            <input id="saturation" type="range" min="0" max="160" value="100">
            <output>100</output>
          </label>
          <label class="knob">
            <span>Warp</span>
            <input id="warp" type="range" min="0" max="100" value="42">
            <output>42</output>
          </label>
          <label class="knob">
            <span>Bars</span>
            <input id="bars" type="range" min="16" max="192" value="96">
            <output>96</output>
          </label>
          <label class="knob">
            <span>Motion</span>
            <input id="motion" type="range" min="0" max="100" value="54">
            <output>54</output>
          </label>
          <label class="knob">
            <span>Grain</span>
            <input id="grain" type="range" min="0" max="100" value="20">
            <output>20</output>
          </label>
        </div>

        <div class="toggles">
          <label><input id="mirror" type="checkbox" checked> Mirror</label>
          <label><input id="trails" type="checkbox" checked> Trails</label>
          <label><input id="beatFlash" type="checkbox" checked> Beat flash</label>
          <label><input id="exportHud" type="checkbox" checked> Export HUD</label>
        </div>
      </aside>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
